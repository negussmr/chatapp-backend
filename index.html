<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>ChatApp</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #080808;
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   AUTH
   ========================= */

#authScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at top, #202020 0, #0d0d0d 45%, #050505 100%);
}

.authBox {
  width: 100%;
  max-width: 420px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 70px rgba(0,0,0,.5);
}

.logo {
  font-size: 30px;
  font-weight: 800;
  margin-bottom: 8px;
}

.subtitle {
  color: #999;
  margin-bottom: 28px;
}

.field {
  margin-bottom: 15px;
}

.field label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 7px;
}

.field input {
  width: 100%;
  border: 1px solid #303030;
  background: #181818;
  color: white;
  padding: 13px 14px;
  border-radius: 11px;
  outline: none;
}

.field input:focus {
  border-color: #777;
}

.primary {
  width: 100%;
  border: 0;
  background: #fff;
  color: #000;
  padding: 13px;
  border-radius: 11px;
  font-weight: 700;
  margin-top: 5px;
}

.secondary {
  width: 100%;
  border: 1px solid #333;
  background: #181818;
  color: #fff;
  padding: 12px;
  border-radius: 11px;
  margin-top: 10px;
}

.authSwitch {
  text-align: center;
  color: #888;
  margin-top: 20px;
  font-size: 14px;
}

.authSwitch button {
  background: none;
  border: 0;
  color: white;
  padding: 0;
  font-weight: 700;
}

/* =========================
   APP
   ========================= */

#appScreen {
  height: 100vh;
  display: flex;
  overflow: hidden;
}

.sidebar {
  width: 320px;
  flex-shrink: 0;
  border-right: 1px solid #242424;
  background: #0d0d0d;
  display: flex;
  flex-direction: column;
}

.sidebarHeader {
  padding: 18px;
  border-bottom: 1px solid #222;
}

.sidebarTop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.sidebarTitle {
  font-size: 21px;
  font-weight: 800;
}

.iconButton {
  width: 38px;
  height: 38px;
  border: 1px solid #303030;
  border-radius: 10px;
  background: #171717;
  color: white;
}

.searchBox {
  margin-top: 14px;
}

.searchBox input {
  width: 100%;
  background: #171717;
  color: white;
  border: 1px solid #292929;
  border-radius: 10px;
  padding: 11px 12px;
  outline: none;
}

.conversationList {
  flex: 1;
  overflow-y: auto;
}

.conversation {
  padding: 14px 16px;
  border-bottom: 1px solid #181818;
  cursor: pointer;
}

.conversation:hover {
  background: #151515;
}

.conversation.active {
  background: #202020;
}

.conversationName {
  font-weight: 700;
  margin-bottom: 5px;
}

.conversationPreview {
  color: #777;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebarBottom {
  padding: 14px;
  border-top: 1px solid #222;
}

.profileButton {
  width: 100%;
  background: #171717;
  color: white;
  border: 1px solid #292929;
  padding: 12px;
  border-radius: 10px;
  text-align: left;
}

/* =========================
   CHAT
   ========================= */

.chatArea {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #080808;
}

.chatHeader {
  height: 70px;
  flex-shrink: 0;
  border-bottom: 1px solid #242424;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
}

.mobileBack {
  display: none;
}

.chatTitle {
  font-weight: 800;
}

.chatStatus {
  color: #777;
  font-size: 12px;
  margin-top: 3px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px;
}

.emptyChat {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  text-align: center;
}

.messageRow {
  display: flex;
  margin-bottom: 12px;
}

.messageRow.mine {
  justify-content: flex-end;
}

.messageBubble {
  max-width: min(75%, 620px);
  padding: 10px 13px;
  border-radius: 15px;
  background: #1b1b1b;
  border: 1px solid #292929;
}

.messageRow.mine .messageBubble {
  background: #eee;
  color: #000;
  border-color: #eee;
}

.messageAuthor {
  font-size: 11px;
  color: #888;
  margin-bottom: 4px;
}

.messageRow.mine .messageAuthor {
  color: #555;
}

.messageBody {
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.4;
}

.messageMeta {
  margin-top: 5px;
  font-size: 10px;
  opacity: .55;
}

.messageActions {
  display: flex;
  gap: 5px;
  margin-top: 7px;
}

.messageActions button {
  border: 1px solid #333;
  background: transparent;
  color: inherit;
  border-radius: 7px;
  padding: 3px 7px;
  font-size: 11px;
}

.composer {
  border-top: 1px solid #242424;
  padding: 12px;
  display: flex;
  gap: 9px;
}

.composer textarea {
  flex: 1;
  min-height: 44px;
  max-height: 130px;
  resize: none;
  background: #151515;
  color: white;
  border: 1px solid #292929;
  border-radius: 12px;
  padding: 12px;
  outline: none;
}

.sendButton {
  width: 80px;
  border: 0;
  background: white;
  color: black;
  border-radius: 12px;
  font-weight: 700;
}

/* =========================
   MODAL
   ========================= */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 50;
}

.modalBox {
  width: 100%;
  max-width: 440px;
  max-height: 85vh;
  overflow-y: auto;
  background: #111;
  border: 1px solid #303030;
  border-radius: 18px;
  padding: 22px;
}

.modalHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.modalTitle {
  font-size: 20px;
  font-weight: 800;
}

.result {
  padding: 12px;
  border: 1px solid #292929;
  border-radius: 10px;
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.resultName {
  font-weight: 700;
}

.resultUsername {
  color: #777;
  font-size: 12px;
}

.smallButton {
  border: 1px solid #333;
  background: #191919;
  color: white;
  padding: 8px 10px;
  border-radius: 8px;
}

.dangerButton {
  border: 1px solid #5a2222;
  background: #241111;
  color: #ff9d9d;
  padding: 9px 12px;
  border-radius: 9px;
}

/* =========================
   TOAST
   ========================= */

#toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  background: #eee;
  color: #000;
  padding: 11px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  z-index: 100;
  display: none;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

  .sidebar {
    width: 100%;
  }

  .chatArea {
    display: none;
  }

  #appScreen.chatOpen .sidebar {
    display: none;
  }

  #appScreen.chatOpen .chatArea {
    display: flex;
  }

  .mobileBack {
    display: block;
  }

  .messageBubble {
    max-width: 85%;
  }

  .authBox {
    padding: 23px;
  }
}
</style>
</head>

<body>

<!-- =========================
     AUTH SCREEN
     ========================= -->

<div id="authScreen">

  <div class="authBox">

    <div class="logo">ChatApp</div>
    <div class="subtitle" id="authSubtitle">
      Sign in to continue.
    </div>

    <form id="loginForm">

      <div class="field">
        <label>Username or email</label>
        <input
          id="loginInput"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="primary" type="submit">
        Log in
      </button>

    </form>

    <form id="registerForm" class="hidden">

      <div class="field">
        <label>Username</label>
        <input
          id="registerUsername"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label>Email</label>
        <input
          id="registerEmail"
          type="email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label>Display name</label>
        <input
          id="registerDisplayName"
          autocomplete="name"
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          required
          minlength="6"
        >
      </div>

      <button class="primary" type="submit">
        Create account
      </button>

    </form>

    <div class="authSwitch">
      <span id="authSwitchText">Don't have an account?</span>
      <button id="authSwitchButton" type="button">
        Register
      </button>
    </div>

  </div>

</div>


<!-- =========================
     APP SCREEN
     ========================= -->

<div id="appScreen" class="hidden">

  <aside class="sidebar">

    <div class="sidebarHeader">

      <div class="sidebarTop">
        <div class="sidebarTitle">Chats</div>

        <button
          class="iconButton"
          id="newChatButton"
          title="New chat"
        >
          +
        </button>
      </div>

      <div class="searchBox">
        <input
          id="userSearch"
          placeholder="Search users..."
        >
      </div>

    </div>

    <div
      class="conversationList"
      id="conversationList"
    ></div>

    <div class="sidebarBottom">

      <button
        class="profileButton"
        id="profileButton"
      >
        Profile
      </button>

    </div>

  </aside>


  <main class="chatArea">

    <header class="chatHeader">

      <button
        class="iconButton mobileBack"
        id="backButton"
      >
        ←
      </button>

      <div>
        <div
          class="chatTitle"
          id="chatTitle"
        >
          Select a conversation
        </div>

        <div
          class="chatStatus"
          id="chatStatus"
        >
          —
        </div>
      </div>

    </header>

    <section
      class="messages"
      id="messages"
    >

      <div class="emptyChat">
        Select a conversation to start chatting.
      </div>

    </section>

    <form
      class="composer"
      id="messageForm"
    >

      <textarea
        id="messageInput"
        placeholder="Write a message..."
        disabled
      ></textarea>

      <button
        class="sendButton"
        type="submit"
        disabled
        id="sendButton"
      >
        Send
      </button>

    </form>

  </main>

</div>


<!-- =========================
     MODAL
     ========================= -->

<div
  class="modal hidden"
  id="modal"
>

  <div class="modalBox">

    <div class="modalHeader">

      <div
        class="modalTitle"
        id="modalTitle"
      >
        Modal
      </div>

      <button
        class="iconButton"
        id="modalClose"
      >
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const API_BASE =
  "https://chatapp-backend-ol8d.onrender.com";


/* =========================================================
   STATE
   ========================================================= */

const state = {
  accessToken: localStorage.getItem("chat_access_token") || "",
  refreshToken: localStorage.getItem("chat_refresh_token") || "",
  user: null,
  conversations: [],
  currentConversation: null,
  messages: [],
  polling: null,
  lastMessageId: null,
  authMode: "login"
};


/* =========================================================
   DOM
   ========================================================= */

const $ = id => document.getElementById(id);

const authScreen = $("authScreen");
const appScreen = $("appScreen");

const loginForm = $("loginForm");
const registerForm = $("registerForm");

const authSubtitle = $("authSubtitle");
const authSwitchText = $("authSwitchText");
const authSwitchButton = $("authSwitchButton");

const conversationList = $("conversationList");
const messages = $("messages");

const chatTitle = $("chatTitle");
const chatStatus = $("chatStatus");

const messageForm = $("messageForm");
const messageInput = $("messageInput");
const sendButton = $("sendButton");

const modal = $("modal");
const modalTitle = $("modalTitle");
const modalContent = $("modalContent");

const toast = $("toast");


/* =========================================================
   HELPERS
   ========================================================= */

function showToast(message) {

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(() => {
    toast.style.display = "none";
  }, 3000);
}


function saveSession(data) {

  state.accessToken = data.access_token;
  state.refreshToken = data.refresh_token;

  localStorage.setItem(
    "chat_access_token",
    state.accessToken
  );

  localStorage.setItem(
    "chat_refresh_token",
    state.refreshToken
  );
}


function clearSession() {

  state.accessToken = "";
  state.refreshToken = "";
  state.user = null;

  localStorage.removeItem("chat_access_token");
  localStorage.removeItem("chat_refresh_token");
}


function showAuth() {

  authScreen.classList.remove("hidden");
  appScreen.classList.add("hidden");
}


function showApp() {

  authScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");
}


function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatTime(value) {

  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });
}


function getConversationName(conversation) {

  if (!conversation) {
    return "Conversation";
  }

  if (conversation.title) {
    return conversation.title;
  }

  if (conversation.name) {
    return conversation.name;
  }

  if (conversation.type === "direct") {

    if (conversation.other_user) {
      return (
        conversation.other_user.display_name ||
        conversation.other_user.username ||
        "User"
      );
    }

    if (conversation.user) {
      return (
        conversation.user.display_name ||
        conversation.user.username ||
        "User"
      );
    }
  }

  return "Conversation";
}


/* =========================================================
   API
   ========================================================= */

async function api(path, options = {}, retry = true) {

  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (state.accessToken) {
    headers.Authorization =
      "Bearer " + state.accessToken;
  }

  let response;

  try {

    response = await fetch(
      API_BASE.replace(/\/$/, "") + path,
      {
        ...options,
        headers
      }
    );

  } catch (error) {

    throw new Error(
      "Could not connect to the server."
    );
  }


  if (
    response.status === 401 &&
    retry &&
    state.refreshToken
  ) {

    try {

      const refreshResponse = await fetch(
        API_BASE + "/api/auth/refresh",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            refresh_token: state.refreshToken
          })
        }
      );

      if (refreshResponse.ok) {

        const refreshData =
          await refreshResponse.json();

        saveSession(refreshData);

        return api(
          path,
          options,
          false
        );
      }

    } catch (_) {}

    clearSession();
    showAuth();

    throw new Error("Session expired.");
  }


  let data = null;

  const text = await response.text();

  if (text) {

    try {
      data = JSON.parse(text);
    } catch (_) {
      data = {
        error: text
      };
    }
  }


  if (!response.ok) {

    throw new Error(
      data?.error ||
      data?.message ||
      "Request failed."
    );
  }

  return data;
}


/* =========================================================
   AUTH
   ========================================================= */

function setAuthMode(mode) {

  state.authMode = mode;

  if (mode === "login") {

    loginForm.classList.remove("hidden");
    registerForm.classList.add("hidden");

    authSubtitle.textContent =
      "Sign in to continue.";

    authSwitchText.textContent =
      "Don't have an account?";

    authSwitchButton.textContent =
      "Register";

  } else {

    loginForm.classList.add("hidden");
    registerForm.classList.remove("hidden");

    authSubtitle.textContent =
      "Create your account.";

    authSwitchText.textContent =
      "Already have an account?";

    authSwitchButton.textContent =
      "Log in";
  }
}


authSwitchButton.addEventListener(
  "click",
  () => {

    setAuthMode(
      state.authMode === "login"
        ? "register"
        : "login"
    );

  }
);


loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const login =
      $("loginInput").value.trim();

    const password =
      $("loginPassword").value;

    if (!login || !password) {
      showToast("Fill in both fields.");
      return;
    }

    try {

      const data = await api(
        "/api/auth/login",
        {
          method: "POST",
          body: JSON.stringify({
            login,
            password
          })
        },
        false
      );

      saveSession(data);

      state.user = data.user;

      showApp();

      await loadConversations();

      startPolling();

      showToast("Logged in.");

    } catch (error) {

      showToast(error.message);
    }

  }
);


registerForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const username =
      $("registerUsername").value.trim();

    const email =
      $("registerEmail").value.trim();

    const display_name =
      $("registerDisplayName").value.trim();

    const password =
      $("registerPassword").value;

    if (!username || !email || !password) {
      showToast("Fill in the required fields.");
      return;
    }

    try {

      const data = await api(
        "/api/auth/register",
        {
          method: "POST",
          body: JSON.stringify({
            username,
            email,
            password,
            display_name
          })
        },
        false
      );

      saveSession(data);

      state.user = data.user;

      showApp();

      await loadConversations();

      startPolling();

      showToast("Account created.");

    } catch (error) {

      showToast(error.message);
    }

  }
);


/* =========================================================
   CURRENT USER
   ========================================================= */

async function loadCurrentUser() {

  const data = await api(
    "/api/auth/me"
  );

  state.user = data.user;
}


/* =========================================================
   CONVERSATIONS
   ========================================================= */

async function loadConversations() {

  const data =
    await api("/api/conversations");

  state.conversations =
    Array.isArray(data?.conversations)
      ? data.conversations
      : [];

  renderConversations();
}


function renderConversations() {

  if (!state.conversations.length) {

    conversationList.innerHTML = `
      <div style="
        padding:25px;
        color:#666;
        text-align:center;
      ">
        No conversations yet.
      </div>
    `;

    return;
  }


  conversationList.innerHTML =
    state.conversations
      .map(conversation => {

        const id = conversation.id;

        const active =
          state.currentConversation?.id === id;

        const name =
          getConversationName(conversation);

        const preview =
          conversation.last_message?.body ||
          conversation.last_message ||
          "No messages yet.";

        return `
          <div
            class="conversation ${active ? "active" : ""}"
            data-id="${escapeHTML(id)}"
          >

            <div class="conversationName">
              ${escapeHTML(name)}
            </div>

            <div class="conversationPreview">
              ${escapeHTML(preview)}
            </div>

          </div>
        `;

      })
      .join("");


  document
    .querySelectorAll(".conversation")
    .forEach(element => {

      element.addEventListener(
        "click",
        () => {

          const id =
            element.dataset.id;

          openConversation(id);
        }
      );

    });
}


/* =========================================================
   OPEN CONVERSATION
   ========================================================= */

async function openConversation(id) {

  const conversation =
    state.conversations.find(
      item => String(item.id) === String(id)
    );

  if (!conversation) return;

  state.currentConversation =
    conversation;

  state.lastMessageId = null;

  appScreen.classList.add("chatOpen");

  chatTitle.textContent =
    getConversationName(conversation);

  chatStatus.textContent =
    conversation.type === "group"
      ? "Group"
      : "Direct message";

  messageInput.disabled = false;
  sendButton.disabled = false;

  renderConversations();

  await loadMessages();

  try {

    await api(
      `/api/conversations/${id}/read`,
      {
        method: "POST"
      }
    );

  } catch (_) {}
}


/* =========================================================
   MESSAGES
   ========================================================= */

async function loadMessages() {

  if (!state.currentConversation) {
    return;
  }

  const id =
    state.currentConversation.id;

  try {

    const data =
      await api(
        `/api/conversations/${id}/messages?limit=100`
      );

    state.messages =
      Array.isArray(data?.messages)
        ? data.messages
        : [];

    renderMessages();

  } catch (error) {

    showToast(error.message);
  }
}


function getMessageUserId(message) {

  return (
    message.user_id ||
    message.sender_id ||
    message.author_id ||
    message.user?.id ||
    null
  );
}


function isMine(message) {

  return String(
    getMessageUserId(message)
  ) === String(
    state.user?.id
  );
}


function renderMessages() {

  if (!state.messages.length) {

    messages.innerHTML = `
      <div class="emptyChat">
        No messages yet.<br>
        Send the first message.
      </div>
    `;

    return;
  }


  messages.innerHTML =
    state.messages
      .map(message => {

        const mine =
          isMine(message);

        const body =
          message.body || "";

        const author =
          message.sender?.display_name ||
          message.sender?.username ||
          message.user?.display_name ||
          message.user?.username ||
          (mine ? "You" : "User");

        const time =
          formatTime(
            message.created_at ||
            message.createdAt
          );

        const id =
          message.id;

        return `
          <div
            class="messageRow ${mine ? "mine" : ""}"
          >

            <div class="messageBubble">

              ${
                !mine
                  ? `
                    <div class="messageAuthor">
                      ${escapeHTML(author)}
                    </div>
                  `
                  : ""
              }

              <div class="messageBody">
                ${escapeHTML(body)}
              </div>

              <div class="messageMeta">
                ${escapeHTML(time)}
              </div>

              ${
                mine
                  ? `
                    <div class="messageActions">

                      <button
                        data-edit="${escapeHTML(id)}"
                      >
                        Edit
                      </button>

                      <button
                        data-delete="${escapeHTML(id)}"
                      >
                        Delete
                      </button>

                    </div>
                  `
                  : ""
              }

            </div>

          </div>
        `;

      })
      .join("");


  messages
    .querySelectorAll("[data-edit]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => editMessage(
          button.dataset.edit
        )
      );

    });


  messages
    .querySelectorAll("[data-delete]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => deleteMessage(
          button.dataset.delete
        )
      );

    });


  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

messageForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    if (!state.currentConversation) {
      return;
    }

    const body =
      messageInput.value.trim();

    if (!body) return;

    const conversationId =
      state.currentConversation.id;

    sendButton.disabled = true;

    try {

      await api(
        `/api/conversations/${conversationId}/messages`,
        {
          method: "POST",
          body: JSON.stringify({
            body
          })
        }
      );

      messageInput.value = "";

      await loadMessages();

      await loadConversations();

    } catch (error) {

      showToast(error.message);

    } finally {

      sendButton.disabled = false;

      messageInput.focus();
    }

  }
);


/* =========================================================
   EDIT MESSAGE
   ========================================================= */

async function editMessage(id) {

  const message =
    state.messages.find(
      item => String(item.id) === String(id)
    );

  if (!message) return;

  const newBody =
    prompt(
      "Edit message:",
      message.body || ""
    );

  if (
    newBody === null ||
    !newBody.trim()
  ) {
    return;
  }

  try {

    await api(
      `/api/messages/${id}`,
      {
        method: "PUT",
        body: JSON.stringify({
          body: newBody.trim()
        })
      }
    );

    await loadMessages();

  } catch (error) {

    showToast(error.message);
  }
}


/* =========================================================
   DELETE MESSAGE
   ========================================================= */

async function deleteMessage(id) {

  if (
    !confirm(
      "Delete this message?"
    )
  ) {
    return;
  }

  try {

    await api(
      `/api/messages/${id}`,
      {
        method: "DELETE"
      }
    );

    await loadMessages();

  } catch (error) {

    showToast(error.message);
  }
}


/* =========================================================
   NEW CHAT
   ========================================================= */

$("newChatButton").addEventListener(
  "click",
  () => {

    openNewChatModal();

  }
);


function openNewChatModal() {

  modalTitle.textContent =
    "New conversation";

  modalContent.innerHTML = `

    <div class="field">

      <label>
        Search username
      </label>

      <input
        id="newChatSearch"
        placeholder="Enter username..."
      >

    </div>

    <div id="searchResults"></div>

  `;

  openModal();

  $("newChatSearch")
    .addEventListener(
      "input",
      searchUsers
    );

}


let searchTimer = null;


function searchUsers() {

  clearTimeout(searchTimer);

  const query =
    $("newChatSearch").value.trim();

  const results =
    $("searchResults");

  if (!query) {

    results.innerHTML = "";

    return;
  }

  searchTimer =
    setTimeout(
      async () => {

        try {

          const data =
            await api(
              `/api/users/search?q=${encodeURIComponent(query)}`
            );

          const users =
            Array.isArray(data?.users)
              ? data.users
              : [];

          if (!users.length) {

            results.innerHTML = `
              <div style="color:#777;padding:15px 0">
                No users found.
              </div>
            `;

            return;
          }

          results.innerHTML =
            users
              .map(user => `

                <div class="result">

                  <div>

                    <div class="resultName">
                      ${escapeHTML(
                        user.display_name ||
                        user.username
                      )}
                    </div>

                    <div class="resultUsername">
                      @${escapeHTML(
                        user.username
                      )}
                    </div>

                  </div>

                  <button
                    class="smallButton"
                    data-user-id="${escapeHTML(user.id)}"
                  >
                    Chat
                  </button>

                </div>

              `)
              .join("");


          results
            .querySelectorAll(
              "[data-user-id]"
            )
            .forEach(button => {

              button.addEventListener(
                "click",
                () =>
                  createDirectChat(
                    button.dataset.userId
                  )
              );

            });

        } catch (error) {

          results.innerHTML = `
            <div style="color:#ff7777">
              ${escapeHTML(error.message)}
            </div>
          `;

        }

      },
      350
    );
}


async function createDirectChat(userId) {

  try {

    const data =
      await api(
        "/api/conversations",
        {
          method: "POST",
          body: JSON.stringify({
            type: "direct",
            user_id: userId
          })
        }
      );

    closeModal();

    await loadConversations();

    const conversation =
      data?.conversation;

    if (conversation?.id) {

      await openConversation(
        conversation.id
      );

      return;
    }

    if (data?.id) {

      await openConversation(
        data.id
      );

    }

  } catch (error) {

    showToast(error.message);
  }
}


/* =========================================================
   PROFILE
   ========================================================= */

$("profileButton").addEventListener(
  "click",
  openProfile
);


async function openProfile() {

  try {

    const data =
      await api("/api/auth/me");

    state.user =
      data.user;

    modalTitle.textContent =
      "Profile";

    modalContent.innerHTML = `

      <div class="field">

        <label>
          Username
        </label>

        <input
          value="${escapeHTML(
            state.user.username || ""
          )}"
          disabled
        >

      </div>

      <div class="field">

        <label>
          Display name
        </label>

        <input
          id="profileDisplayName"
          value="${escapeHTML(
            state.user.display_name || ""
          )}"
        >

      </div>

      <button
        class="primary"
        id="saveProfile"
      >
        Save profile
      </button>

      <button
        class="dangerButton"
        id="logoutButton"
        style="width:100%;margin-top:12px"
      >
        Log out
      </button>

    `;

    openModal();


    $("saveProfile")
      .addEventListener(
        "click",
        saveProfile
      );


    $("logoutButton")
      .addEventListener(
        "click",
        logout
      );

  } catch (error) {

    showToast(error.message);
  }
}


async function saveProfile() {

  const display_name =
    $("profileDisplayName")
      .value
      .trim();

  try {

    const data =
      await api(
        "/api/users/me",
        {
          method: "PUT",
          body: JSON.stringify({
            display_name
          })
        }
      );

    state.user =
      data.user;

    closeModal();

    showToast("Profile updated.");

  } catch (error) {

    showToast(error.message);
  }
}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {

  try {

    if (state.refreshToken) {

      await api(
        "/api/auth/logout",
        {
          method: "POST",
          body: JSON.stringify({
            refresh_token:
              state.refreshToken
          })
        },
        false
      );

    }

  } catch (_) {}

  stopPolling();

  clearSession();

  state.conversations = [];
  state.currentConversation = null;
  state.messages = [];

  closeModal();

  appScreen.classList.remove("chatOpen");

  showAuth();

  showToast("Logged out.");
}


/* =========================================================
   MODAL
   ========================================================= */

function openModal() {

  modal.classList.remove("hidden");
}


function closeModal() {

  modal.classList.add("hidden");
}


$("modalClose")
  .addEventListener(
    "click",
    closeModal
  );


modal.addEventListener(
  "click",
  event => {

    if (event.target === modal) {
      closeModal();
    }

  }
);


/* =========================================================
   MOBILE
   ========================================================= */

$("backButton")
  .addEventListener(
    "click",
    () => {

      appScreen.classList.remove(
        "chatOpen"
      );

    }
  );


/* =========================================================
   POLLING
   ========================================================= */

function startPolling() {

  stopPolling();

  state.polling =
    setInterval(
      async () => {

        if (
          document.hidden ||
          !state.currentConversation
        ) {
          return;
        }

        try {

          await loadMessages();

        } catch (_) {}

      },
      3000
    );
}


function stopPolling() {

  if (state.polling) {

    clearInterval(
      state.polling
    );

    state.polling = null;
  }
}


/* =========================================================
   KEYBOARD
   ========================================================= */

messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      messageForm.requestSubmit();
    }

  }
);


/* =========================================================
   STARTUP
   ========================================================= */

async function boot() {

  if (!state.accessToken) {

    showAuth();

    return;
  }

  try {

    await loadCurrentUser();

    showApp();

    await loadConversations();

    startPolling();

  } catch (error) {

    clearSession();

    showAuth();

    showToast(
      "Please log in again."
    );
  }
}


setAuthMode("login");

boot();

</script>

</body>
</html>

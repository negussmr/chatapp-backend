<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatApp</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#0b0e12;
  --panel:#11161c;
  --panel2:#181e25;
  --border:#29313a;
  --text:#f4f6f8;
  --muted:#8f9aa6;
  --accent:#6687ff;
  --danger:#ef6262;
  --mine:#506fd0;
}

body{
  margin:0;
  height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}

button{
  border:0;
}

.primary{
  background:var(--accent);
  color:white;
  padding:11px 15px;
  border-radius:10px;
  font-weight:700;
}

.secondary{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  padding:9px 13px;
  border-radius:10px;
}

.danger{
  background:#472326;
  color:#ffb3b3;
  padding:9px 13px;
  border-radius:10px;
}

.ghost{
  background:transparent;
  color:var(--muted);
  padding:5px 7px;
  border-radius:7px;
}

.ghost:hover{
  background:var(--panel2);
  color:white;
}

/* AUTH */

#authScreen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.auth-card{
  width:min(430px,100%);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:27px;
}

.logo{
  font-size:28px;
  font-weight:800;
}

.subtitle{
  color:var(--muted);
  margin:5px 0 22px;
}

.tabs{
  display:flex;
  background:#0b0e12;
  padding:4px;
  border-radius:10px;
  margin-bottom:18px;
}

.tabs button{
  flex:1;
  padding:9px;
  background:transparent;
  color:var(--muted);
  border-radius:8px;
}

.tabs button.active{
  background:var(--panel2);
  color:white;
}

.field{
  margin:12px 0;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:5px;
}

.field input,
.field textarea{
  width:100%;
  background:#0b0e12;
  border:1px solid var(--border);
  color:white;
  padding:11px;
  border-radius:10px;
  outline:none;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--accent);
}

.check{
  display:flex;
  gap:8px;
  font-size:12px;
  color:var(--muted);
  margin:9px 0;
}

.check input{
  margin-top:3px;
}

.legal{
  font-size:11px;
  color:var(--muted);
  margin-top:12px;
}

.legal a{
  color:var(--accent);
  cursor:pointer;
}

#error{
  color:#ff8e8e;
  font-size:13px;
  min-height:18px;
  margin-top:8px;
}

/* APP */

#app{
  height:100vh;
  display:grid;
  grid-template-columns:320px 1fr;
  overflow:hidden;
}

.sidebar{
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  min-width:0;
}

.side-header{
  padding:16px;
  border-bottom:1px solid var(--border);
}

.side-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.side-title strong{
  font-size:20px;
}

.icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--panel2);
  border:1px solid var(--border);
  color:white;
}

.search{
  padding:10px;
  border-bottom:1px solid var(--border);
}

.search input{
  width:100%;
  background:#0b0e12;
  color:white;
  border:1px solid var(--border);
  padding:10px;
  border-radius:10px;
  outline:none;
}

.nav{
  display:flex;
  gap:5px;
  padding:8px;
  border-bottom:1px solid var(--border);
}

.nav button{
  flex:1;
  background:transparent;
  color:var(--muted);
  padding:9px;
  border-radius:8px;
  font-size:12px;
}

.nav button.active{
  background:var(--panel2);
  color:white;
}

.list{
  overflow:auto;
  flex:1;
}

.conv,
.user-row{
  display:flex;
  gap:10px;
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.03);
}

.conv{
  cursor:pointer;
}

.conv:hover,
.conv.active{
  background:var(--panel2);
}

.avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:#293346;
  display:grid;
  place-items:center;
  font-weight:800;
}

.conv-info{
  min-width:0;
  flex:1;
}

.conv-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.conv-name{
  font-weight:700;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.time{
  font-size:10px;
  color:var(--muted);
}

.preview{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.badge{
  display:inline-grid;
  place-items:center;
  min-width:19px;
  height:19px;
  padding:0 5px;
  margin-left:5px;
  background:var(--accent);
  border-radius:10px;
  color:white;
  font-size:10px;
}

.side-footer{
  display:flex;
  gap:7px;
  padding:10px;
  border-top:1px solid var(--border);
}

.side-footer button{
  flex:1;
}

/* CHAT */

.main{
  min-width:0;
  min-height:0;
  background:#0d1116;
}

.empty{
  height:100%;
  display:grid;
  place-items:center;
  text-align:center;
  color:var(--muted);
  padding:30px;
}

.chat{
  height:100%;
  display:flex;
  flex-direction:column;
}

.chat-header{
  min-height:66px;
  padding:10px 15px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-info{
  flex:1;
  min-width:0;
}

.chat-name{
  font-weight:800;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.chat-status{
  color:var(--muted);
  font-size:11px;
}

.messages{
  flex:1;
  overflow:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.message-row{
  max-width:min(720px,85%);
  display:flex;
  gap:7px;
  align-items:flex-end;
}

.message-row.mine{
  align-self:flex-end;
  flex-direction:row-reverse;
}

.message-avatar{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#293346;
  display:grid;
  place-items:center;
  font-size:9px;
  font-weight:800;
}

.message-wrap{
  min-width:0;
}

.sender{
  color:var(--muted);
  font-size:10px;
  margin:0 8px 3px;
}

.mine .sender{
  text-align:right;
}

.bubble{
  background:#1a2027;
  border:1px solid var(--border);
  padding:9px 11px;
  border-radius:15px;
  word-break:break-word;
}

.mine .bubble{
  background:var(--mine);
  border-color:transparent;
}

.deleted{
  color:var(--muted);
  font-style:italic;
}

.reply-preview{
  border-left:3px solid var(--accent);
  background:rgba(0,0,0,.18);
  padding:5px 8px;
  margin-bottom:6px;
  border-radius:5px;
  font-size:11px;
  color:#dce1e7;
}

.meta{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  font-size:9px;
  color:rgba(255,255,255,.55);
  margin-top:4px;
}

.reactions{
  display:flex;
  gap:3px;
  flex-wrap:wrap;
  margin-top:4px;
}

.reaction{
  background:var(--panel2);
  border:1px solid var(--border);
  color:white;
  border-radius:10px;
  padding:2px 6px;
  font-size:11px;
}

.message-actions{
  display:flex;
  justify-content:flex-start;
  margin-top:2px;
}

.mine .message-actions{
  justify-content:flex-end;
}

.composer{
  background:var(--panel);
  border-top:1px solid var(--border);
  padding:10px;
  display:flex;
  gap:8px;
}

.composer textarea{
  flex:1;
  resize:none;
  min-height:42px;
  max-height:130px;
  background:#0b0e12;
  color:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  outline:none;
}

.reply-bar{
  background:#161c23;
  border-top:1px solid var(--border);
  padding:7px 12px;
  display:flex;
  gap:10px;
  align-items:center;
  font-size:12px;
}

.reply-bar div{
  flex:1;
  min-width:0;
}

.reply-bar small{
  display:block;
  color:var(--muted);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.typing{
  height:20px;
  padding:0 15px;
  color:var(--muted);
  font-size:11px;
}

.load{
  align-self:center;
}

/* MODAL */

.modal-back{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.7);
  display:grid;
  place-items:center;
  padding:18px;
}

.modal{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  padding:20px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal h2{
  margin:0 0 10px;
}

.modal p,
.modal li{
  color:#c4ccd5;
  font-size:13px;
  line-height:1.55;
}

.user-row{
  align-items:center;
}

.user-row .grow{
  flex:1;
  min-width:0;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.actions button{
  font-size:11px;
}

.toast{
  position:fixed;
  z-index:300;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#202730;
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:11px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.mobile-only{
  display:none;
}

@media(max-width:760px){

  #app{
    display:block;
  }

  .sidebar{
    position:absolute;
    inset:0;
    z-index:10;
  }

  .main{
    display:none;
    height:100vh;
  }

  #app.chat-open .sidebar{
    display:none;
  }

  #app.chat-open .main{
    display:block;
  }

  .mobile-only{
    display:block;
  }

  .message-row{
    max-width:92%;
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authScreen">

  <div class="auth-card">

    <div class="logo">ChatApp</div>
    <div class="subtitle">
      Messages. Friends. Groups.
    </div>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="setAuthMode('login')">
        Login
      </button>

      <button id="registerTab" onclick="setAuthMode('register')">
        Register
      </button>
    </div>

    <form id="authForm">

      <div id="usernameField" class="field hidden">
        <label>Username</label>
        <input id="username" maxlength="20">
      </div>

      <div class="field">
        <label id="loginLabel">Username or email</label>
        <input id="login" required>
      </div>

      <div id="emailField" class="field hidden">
        <label>Email</label>
        <input id="email" type="email">
      </div>

      <div id="displayField" class="field hidden">
        <label>Display name</label>
        <input id="displayName" maxlength="50">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password"
               type="password"
               minlength="8"
               maxlength="72"
               required>
      </div>

      <div id="registerChecks" class="hidden">

        <label class="check">
          <input id="ageCheck" type="checkbox">
          <span>I confirm that I am 16 years old or older.</span>
        </label>

        <label class="check">
          <input id="termsCheck" type="checkbox">
          <span>
            I agree to the
            <a onclick="showLegal('terms')">Terms of Service</a>.
          </span>
        </label>

        <label class="check">
          <input id="privacyCheck" type="checkbox">
          <span>
            I have read the
            <a onclick="showLegal('privacy')">Privacy Policy</a>.
          </span>
        </label>

        <label class="check">
          <input id="consentCheck" type="checkbox">
          <span>
            I consent to the processing described in the Privacy Policy.
          </span>
        </label>

      </div>

      <button id="authButton"
              class="primary"
              style="width:100%;margin-top:8px">
        Login
      </button>

      <div id="error"></div>

    </form>

    <div class="legal">
      By using ChatApp you agree to follow the
      <a onclick="showLegal('community')">
        Community Guidelines
      </a>.
    </div>

  </div>

</section>


<!-- APP -->

<div id="app" class="hidden">

  <aside class="sidebar">

    <div class="side-header">

      <div class="side-title">

        <strong>ChatApp</strong>

        <button class="icon"
                onclick="openMenu()">
          ⋯
        </button>

      </div>

    </div>


    <div class="search">

      <input id="globalSearch"
             placeholder="Search users..."
             oninput="debouncedSearch()">

    </div>


    <div class="nav">

      <button data-tab="chats"
              class="active"
              onclick="setSideTab('chats')">
        Chats
      </button>

      <button data-tab="friends"
              onclick="setSideTab('friends')">
        Friends
      </button>

      <button data-tab="requests"
              onclick="setSideTab('requests')">
        Requests
      </button>

    </div>


    <div id="sideList" class="list"></div>


    <div class="side-footer">

      <button class="secondary"
              onclick="openProfile()">
        Profile
      </button>

      <button class="secondary"
              onclick="logout()">
        Logout
      </button>

    </div>

  </aside>


  <main class="main">

    <div id="emptyState" class="empty">

      <div>
        <h2>Select a conversation</h2>
        <p>
          Choose a chat or add a friend.
        </p>
      </div>

    </div>


    <div id="chatView"
         class="chat hidden">
    </div>

  </main>

</div>


<div id="overlay"></div>
<div id="toast" class="toast hidden"></div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_BASE =
  "https://chatapp-backend-ol8d.onrender.com";


/* =========================================================
   STATE
========================================================= */

const state = {

  mode:"login",

  user:null,
  access:null,
  refresh:null,

  conversations:[],
  unread:{},

  friends:[],
  requests:{
    incoming:[],
    outgoing:[]
  },

  activeId:null,
  activeMeta:null,

  messages:[],
  members:[],
  nextBefore:null,
  lastMessageId:null,

  replyTo:null,
  editingId:null,

  sideTab:"chats",

  pollTimer:null,
  searchTimer:null,
  typingTimer:null

};


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


function escapeHTML(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,char=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char]));

}


function initials(name){

  const parts =
    String(name || "?")
      .trim()
      .split(/\s+/)
      .slice(0,2);

  return parts
    .map(x=>x[0])
    .join("")
    .toUpperCase() || "?";

}


function timeFormat(value){

  if(!value)
    return "";

  const d = new Date(value);
  const now = new Date();

  if(d.toDateString() === now.toDateString()){

    return d.toLocaleTimeString([],{
      hour:"numeric",
      minute:"2-digit"
    });

  }

  return d.toLocaleDateString([],{
    month:"short",
    day:"numeric"
  });

}


function fullTime(value){

  if(!value)
    return "";

  return new Date(value)
    .toLocaleString([],{
      month:"short",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    });

}


function toast(message){

  const el=$("toast");

  el.textContent=message;
  el.classList.remove("hidden");

  clearTimeout(toast.timer);

  toast.timer=setTimeout(()=>{
    el.classList.add("hidden");
  },2800);

}


async function parseResponse(response){

  const text=await response.text();

  try{
    return text ? JSON.parse(text) : {};
  }
  catch{
    return {
      error:text || "Invalid server response"
    };
  }

}


/* =========================================================
   AUTH
========================================================= */

function setAuthMode(mode){

  state.mode=mode;

  const register =
    mode === "register";

  $("loginTab")
    .classList.toggle("active",!register);

  $("registerTab")
    .classList.toggle("active",register);

  $("usernameField")
    .classList.toggle("hidden",!register);

  $("emailField")
    .classList.toggle("hidden",!register);

  $("displayField")
    .classList.toggle("hidden",!register);

  $("registerChecks")
    .classList.toggle("hidden",!register);

  $("loginLabel").textContent =
    register
      ? "Login username"
      : "Username or email";

  $("authButton").textContent =
    register
      ? "Create account"
      : "Login";

  $("error").textContent="";

}


$("authForm").addEventListener(
  "submit",
  async event=>{

    event.preventDefault();

    $("error").textContent="";

    try{

      if(state.mode==="register"){

        if(!$("ageCheck").checked)
          throw new Error(
            "You must confirm that you are 16 or older."
          );

        if(
          !$("termsCheck").checked ||
          !$("privacyCheck").checked ||
          !$("consentCheck").checked
        ){

          throw new Error(
            "Please accept the required Terms, Privacy Policy, and consent."
          );

        }


        await authRequest(
          "/api/auth/register",
          {
            username:$("username").value.trim(),
            email:$("email").value.trim(),
            password:$("password").value,
            display_name:
              $("displayName").value.trim() || undefined
          }
        );

      }

      else{

        await authRequest(
          "/api/auth/login",
          {
            login:$("login").value.trim(),
            password:$("password").value
          }
        );

      }


      await bootApp();

    }

    catch(error){

      $("error").textContent =
        error.message;

    }

  }
);


async function authRequest(path,body){

  const response =
    await fetch(
      API_BASE + path,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify(body)
      }
    );


  const data =
    await parseResponse(response);


  if(!response.ok)
    throw new Error(
      data.error || "Request failed"
    );


  state.user=data.user;
  state.access=data.access_token;
  state.refresh=data.refresh_token;

  saveSession();

}


function saveSession(){

  localStorage.setItem(
    "chatapp_session",

    JSON.stringify({

      user:state.user,
      access:state.access,
      refresh:state.refresh

    })
  );

}


function loadSession(){

  try{

    const session =
      JSON.parse(
        localStorage.getItem(
          "chatapp_session"
        ) || "null"
      );

    if(!session)
      return false;

    state.user=session.user;
    state.access=session.access;
    state.refresh=session.refresh;

    return true;

  }

  catch{

    return false;

  }

}


function clearSession(){

  localStorage.removeItem(
    "chatapp_session"
  );

  state.user=null;
  state.access=null;
  state.refresh=null;

}


async function api(path,options={},retry=true){

  const headers={
    ...(options.headers || {}),
    Authorization:
      "Bearer " + state.access
  };


  if(
    options.body &&
    !headers["Content-Type"]
  ){

    headers["Content-Type"]=
      "application/json";

  }


  let response =
    await fetch(
      API_BASE + path,
      {
        ...options,
        headers
      }
    );


  let data =
    await parseResponse(response);


  if(
    response.status===401 &&
    retry &&
    state.refresh
  ){

    const refreshResponse =
      await fetch(
        API_BASE + "/api/auth/refresh",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            refresh_token:
              state.refresh
          })
        }
      );


    const refreshData =
      await parseResponse(
        refreshResponse
      );


    if(refreshResponse.ok){

      state.access=
        refreshData.access_token;

      state.refresh=
        refreshData.refresh_token;

      saveSession();

      return api(
        path,
        options,
        false
      );

    }


    clearSession();

    location.reload();

    throw new Error(
      "Session expired."
    );

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      "Request failed"
    );

  }


  return data;

}


/* =========================================================
   APP BOOT
========================================================= */

async function bootApp(){

  $("authScreen")
    .classList.add("hidden");

  $("app")
    .classList.remove("hidden");


  await refreshMe();

  await loadConversations();

  await setSideTab("chats");


  clearInterval(state.pollTimer);

  state.pollTimer =
    setInterval(
      backgroundPoll,
      5000
    );

}


async function refreshMe(){

  const data =
    await api("/api/auth/me");

  state.user=data.user;

  saveSession();

}


async function logout(){

  try{

    if(state.refresh){

      await fetch(
        API_BASE + "/api/auth/logout",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            refresh_token:
              state.refresh
          })
        }
      );

    }

  }

  catch{}


  clearInterval(
    state.pollTimer
  );

  clearSession();

  location.reload();

}


/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations(){

  const [
    conversationData,
    unreadData
  ] = await Promise.all([

    api("/api/conversations"),

    api("/api/unread")

  ]);


  state.unread={};


  for(
    const item of
    unreadData.conversations || []
  ){

    state.unread[
      item.conversation_id
    ]=item;

  }


  state.conversations =
    (conversationData.conversations || [])
      .map(conversation=>({

        ...conversation,

        unread:
          state.unread[
            conversation.id
          ]?.unread || 0,

        last_message_at:
          state.unread[
            conversation.id
          ]?.last_message_at || null

      }))
      .sort(
        (a,b)=>
          new Date(
            b.last_message_at ||
            b.created_at
          )
          -
          new Date(
            a.last_message_at ||
            a.created_at
          )
      );


  if(state.sideTab==="chats")
    renderSide();

}


function conversationName(c){

  if(c.type==="group")
    return c.title || "Group";

  return (
    c.other_display_name ||
    c.other_username ||
    "Direct chat"
  );

}


function conversationSubtitle(c){

  if(c.type==="group")
    return "Group";

  return "@"+(
    c.other_username || ""
  );

}

async function setSideTab(tab){

  state.sideTab=tab;


  document
    .querySelectorAll(".nav button")
    .forEach(button=>{

      button.classList.toggle(
        "active",
        button.dataset.tab===tab
      );

    });


  if(tab==="chats")
    await loadConversations();

  if(tab==="friends")
    await loadFriends();

  if(tab==="requests")
    await loadRequests();


  renderSide();

}


function renderSide(){

  if(state.sideTab==="chats")
    renderChats();

  else if(state.sideTab==="friends")

  else

}

    state.activeMeta=
      conversation.conversation;

    state.members=
      conversation.members || [];

    state.editingId=null;


    $("app")
      .classList.add("chat-open");

/* =========================================================
   MESSAGES
========================================================= */

async function loadMessages(id){

  const data =
    await api(
      "/api/conversations/"+id+
      "/messages?limit=50"
    );


  state.messages =
    (data.messages || [])
      .reverse();


  state.nextBefore=
    data.next_before;


  state.lastMessageId=
    state.messages.at(-1)?.id || null;

}


async function loadOlder(){

  if(
    !state.nextBefore ||
    !state.activeId
  )
    return;


  try{

    const box=$("messages");

    const oldHeight=
      box.scrollHeight;


    const data =
      await api(
        "/api/conversations/"+
        state.activeId+
        "/messages?limit=50&before="+
        encodeURIComponent(
          state.nextBefore
        )
      );


    const older =
      (data.messages || [])
        .reverse();


    state.messages=[
      ...older,
      ...state.messages
    ];


    state.nextBefore=
      data.next_before;


    renderMessages(false);


    box.scrollTop =
      box.scrollHeight -
      oldHeight;

  }

  catch(error){

    toast(error.message);

  }

}

function renderMessages(scrollBottom){

  const box=$("messages");

  if(!box)
    return;


  let html="";


  if(state.nextBefore){

    html+=`

        class="secondary load"
        onclick="loadOlder()"
      >

      </button>

    `;

  }


  html +=
    state.messages
      .map(renderMessage)
      .join("");


  box.innerHTML=html;


  if(scrollBottom)

function renderMessage(message){

  const mine =
    message.sender_id===
    state.user.id;


  const sender =
    message.sender_display_name ||
    message.sender_username ||
    "Unknown";


  const reactionIcons={
    like:"👍",
    love:"❤️",
    laugh:"😂",
    wow:"😮",
    sad:"😢",
    thanks:"🙏"
  };


  const reactions =
    Object.entries(
      message.reactions || {}
    )
    .filter(([,count])=>count>0)
    .map(
      ([reaction,count])=>`

        <button
          class="reaction"
          onclick="
            reactMessage(
              '${message.id}',
              '${reaction}'
            )
          "
        >
          ${reactionIcons[reaction]}
          ${count}
        </button>

      `
    )
    .join("");


  const read =
    mine &&
    state.members.some(
      member=>
        member.user_id!==state.user.id &&
        member.last_read_at &&
        new Date(
          member.last_read_at
        ) >=
        new Date(
          message.created_at
        )
    )
      ? "✓✓"
      : mine
        ? "✓"
        : "";


  return `

    <div
      class="message-row
      ${mine?"mine":""}"
    >

      <div class="message-avatar">
        ${escapeHTML(
          initials(sender)
        )}
      </div>


      <div class="message-wrap">

        <div class="sender">
          ${escapeHTML(sender)}
        </div>


        <div class="bubble">

          ${
            message.reply_to_id
              ? `

                <div
                  class="reply-preview"
                >
                  ${escapeHTML(
                    message.reply_preview ||
                    "Reply"
                  )}
                </div>

              `
              : ""
          }


          <div
            class="${
              message.deleted
                ? "deleted"
                : ""
            }"
          >
            ${
              message.deleted
                ? "Message deleted"
                : escapeHTML(
                    message.body
                  )
            }
          </div>


          <div class="meta">

            <span>
              ${fullTime(
                message.created_at
              )}
            </span>

            ${
              message.edited_at &&
              !message.deleted
                ? "<span>edited</span>"
                : ""
            }

            <span>${read}</span>

          </div>

        </div>


        ${
          reactions
            ? `
              <div class="reactions">
                ${reactions}
              </div>
            `
            : ""
        }


        <div class="message-actions">

          ${
            !message.deleted
              ? `

                <button
                  class="ghost"
                  onclick="
                    reactMessage(
                      '${message.id}',
                      'like'
                    )
                  "
                >👍</button>

                <button
                  class="ghost"
                  onclick="
                    reactMessage(
                      '${message.id}',
                      'love'
                    )
                  "
                >❤️</button>

                <button
                  class="ghost"
                  onclick="
                    reactMessage(
                      '${message.id}',
                      'laugh'
                    )
                  "
                >😂</button>

                <button
                  class="ghost"
                  onclick="
                    replyMessage(
                      '${message.id}'
                    )
                  "
                >↩</button>

              `
              : ""
          }


          ${
            mine &&
            !message.deleted
              ? `

                <button
                  class="ghost"
                  onclick="
                    editMessage(
                      '${message.id}'
                    )
                  "
                >
                  Edit
                </button>

                <button
                  class="ghost"
                  onclick="
                    deleteMessage(
                      '${message.id}'
                    )
                  "
                >
                  Delete
                </button>

              `
              : ""
          }

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   SEND / EDIT / DELETE
========================================================= */

async function sendMessage(event){

  event.preventDefault();


  const input=
    $("composerInput");


  const body=
    input.value.trim();


  if(!body || !state.activeId)
    return;


  try{

    if(state.editingId){

      const data =
        await api(
          "/api/messages/"+
          state.editingId,
          {
            method:"PUT",

            body:JSON.stringify({
              body
            })
          }
        );


      const index=
        state.messages.findIndex(
          x=>x.id===state.editingId
        );


      if(index>=0)
        state.messages[index]=
          data.message;

    }

    else{

      const data =
        await api(
          "/api/conversations/"+
          state.activeId+
          "/messages",
          {
            method:"POST",

            body:JSON.stringify({

              body,

              reply_to_id:
                state.replyTo?.id ||
                null

            })
          }
        );


      state.messages.push(
        data.message
      );


      state.lastMessageId=
        data.message.id;

    }


    cancelCompose();

    renderMessages(true);

    await markRead();

    await loadConversations();

    renderSide();

  }

  catch(error){

    toast(error.message);

  }

}


function editMessage(id){

  const message=
    state.messages.find(
      x=>x.id===id
    );


  if(!message)
    return;


  state.editingId=id;
  state.replyTo=null;


  $("composerInput").value=
    message.body || "";


  renderReplyBar();

  $("composerInput").focus();

}


async function deleteMessage(id){

  if(!confirm(
    "Delete this message?"
  ))
    return;


  try{

    await api(
      "/api/messages/"+id,
      {
        method:"DELETE"
      }
    );


    const index=
      state.messages.findIndex(
        x=>x.id===id
      );


    if(index>=0){

      state.messages[index]={
        ...state.messages[index],
        body:null,
        deleted:true
      };

    }


    renderMessages(false);

  }

  catch(error){

    toast(error.message);

  }

}


/* =========================================================
   REPLIES
========================================================= */

function replyMessage(id){

  const message=
    state.messages.find(
      x=>x.id===id
    );


  if(!message)
    return;


  state.replyTo=message;
  state.editingId=null;


  renderReplyBar();

  $("composerInput")
    .focus();

}


function renderReplyBar(){

  const bar=$("replyBar");

  if(!bar)
    return;


  if(
    !state.replyTo &&
    !state.editingId
  ){

    bar.classList.add(
      "hidden"
    );

    bar.innerHTML="";

    return;

  }


  bar.classList.remove(
    "hidden"
  );


  if(state.editingId){

    bar.innerHTML=`

      <div>

        <b>Editing message</b>

        <small>
          Change the text below.
        </small>

      </div>

      <button
        class="ghost"
        onclick="cancelCompose()"
      >
        Cancel
      </button>

    `;

    return;

  }


  bar.innerHTML=`

    <div>

      <b>
        Replying to
        ${escapeHTML(
          state.replyTo.sender_display_name ||
          state.replyTo.sender_username
        )}
      </b>

      <small>
        ${escapeHTML(
          state.replyTo.body ||
          state.replyTo.reply_preview ||
          "Message"
        )}
      </small>

    </div>

    <button
      class="ghost"
      onclick="cancelCompose()"
    >
      Cancel
    </button>

  `;

}


function cancelCompose(){

  state.replyTo=null;
  state.editingId=null;

  $("composerInput").value="";

  renderReplyBar();

}


/* =========================================================
   REACTIONS
========================================================= */

async function reactMessage(id,reaction){

  try{

    const data =
      await api(
        "/api/messages/"+id+"/react",
        {
          method:"POST",

          body:JSON.stringify({
            reaction
          })
        }
      );


    /*
      Backend returns the user's resulting
      reaction but not their previous reaction.

      Therefore reload the current messages
      after adding/changing a reaction so the
      aggregate counts stay accurate.
    */

    await loadMessages(
      state.activeId
    );


    renderMessages(false);

  }

  catch(error){

    toast(error.message);

  }

}


/* =========================================================
   READ / TYPING / REALTIME
========================================================= */

async function markRead(){

  if(!state.activeId)
    return;


  try{

    await api(
      "/api/conversations/"+
      state.activeId+
      "/read",
      {
        method:"POST"
      }
    );


    const unread=
      state.unread[
        state.activeId
      ];


    if(unread)
      unread.unread=0;


    const conversation=
      state.conversations.find(
        x=>x.id===state.activeId
      );


    if(conversation)
      conversation.unread=0;

  }

  catch{}

}


function handleTyping(){

  if(!state.activeId)
    return;


  clearTimeout(
    state.typingTimer
  );


  api(
    "/api/conversations/"+
    state.activeId+
    "/typing",
    {
      method:"POST"
    }
  ).catch(()=>{});


  state.typingTimer=
    setTimeout(
      ()=>{},
      2500
    );

}


async function pollActive(){

  if(!state.activeId)
    return;


  try{

    const after =
      state.lastMessageId
        ? "?after="+
          encodeURIComponent(
            state.lastMessageId
          )
        : "";


    const data =
      await api(
        "/api/conversations/"+
        state.activeId+
        "/poll"+
        after
      );


    const incoming=
      data.messages || [];


    if(incoming.length){

      const known=
        new Set(
          state.messages.map(
            message=>message.id
          )
        );


      for(const message of incoming){

        if(!known.has(message.id))
          state.messages.push(
            message
          );

      }


      state.lastMessageId=
        state.messages.at(-1)?.id ||
        state.lastMessageId;


      renderMessages(true);

      await markRead();

      await loadConversations();

    }


    if(data.members){

      state.members=
        state.members.map(
          oldMember=>{

            const fresh=
              data.members.find(
                member=>
                  member.user_id===
                  oldMember.id ||
                  member.user_id===
                  oldMember.user_id
              );


            return fresh
              ? {
                  ...oldMember,
                  ...fresh
                }
              : oldMember;

          }
        );


      const typing=
        data.members
          .filter(
            member=>member.typing
          );


      $("typing").textContent=
        typing.length
          ? typing
              .map(x=>x.username)
              .join(", ")+
            " typing…"
          : "";


      updateChatStatus(
        data.members
      );

    }

  }

  catch{}

}


function updateChatStatus(members){

  if(
    state.activeMeta?.type===
    "group"
  )
    return;


  const status=
    $("chatStatus");


  if(!status)
    return;


  const member=
    members[0];


  if(!member){

    status.textContent="";

    return;

  }


  if(member.typing){

    status.textContent=
      "typing…";

  }

  else if(member.online){

    status.textContent=
      "online";

  }

  else{

    status.textContent=
      "offline";

  }

}


function startActivePolling(){

  clearTimeout(
    state.activePolling
  );


  async function loop(){

    await pollActive();


    if(state.activeId){

      state.activePolling=
        setTimeout(
          loop,
          3500
        );

    }

  }


  loop();

}


async function backgroundPoll(){

  if(!state.user)
    return;


  try{

    if(state.activeId){

      await pollActive();

    }

    else{

      await loadConversations();

    }

  }

  catch{}

}

    );

    return;

  }


  try{

    const data=
      await api(
        "/api/users/me",
        {
          method:"PUT",

          body:JSON.stringify({
            display_name:
              displayName
          })
        }
      );


    state.user={
      ...state.user,
      ...data.user
    };


    saveSession();

    closeModal();

    toast(
      "Profile updated."
    );

  catch(error){

function showModal(title,body){

  $("overlay").innerHTML=`

    <div
      class="modal-back"
      onclick="
        if(event.target===this)
          closeModal()
      "
    >

      <div class="modal">

        <div class="modal-header">

          <h2>
            ${escapeHTML(title)}
          </h2>

          <button
            class="icon"
            onclick="closeModal()"
          >
            ×
          </button>

        </div>

        ${body}

      </div>

    </div>

  `;

}


function closeModal(){

  $("overlay").innerHTML="";

}

  state.activeId=null;

  $("app")
    .classList.remove("chat-open");

  $("chatView")
    .classList.add("hidden");

  $("emptyState")
    .classList.remove("hidden");

    .catch(()=>{});

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Escape")
      closeModal();


    if(
      event.key==="Enter" &&
      !event.shiftKey &&
      document.activeElement?.id===
        "composerInput"
    ){

      event.preventDefault();

      $("composerInput")
        .closest("form")
        ?.requestSubmit();

    }

  }
);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #0b0d10;
    --panel: #12161b;
    --panel2: #181d23;
    --border: #252c34;
    --text: #f2f4f7;
    --muted: #8d96a3;
    --accent: #6c8cff;
    --accent2: #4f6fe8;
    --danger: #ff5c6c;
    --success: #4fd18b;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

.screen {
    min-height: 100vh;
}

/* AUTH */

.auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.auth-box {
    width: min(430px, 100%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.logo {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 6px;
}

.subtitle {
    color: var(--muted);
    margin-bottom: 25px;
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    color: #cbd1d9;
    font-size: 14px;
}

.field input,
.field textarea,
.search-input {
    width: 100%;
    background: #0d1116;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    outline: none;
}

.field input:focus,
.field textarea:focus,
.search-input:focus {
    border-color: var(--accent);
}

.primary {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    background: var(--accent);
    color: white;
    font-weight: 700;
}

.primary:hover {
    background: var(--accent2);
}

.secondary {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 9px;
}

.danger {
    background: rgba(255,92,108,.12);
    border: 1px solid rgba(255,92,108,.3);
    color: #ff7885;
    padding: 9px 12px;
    border-radius: 9px;
}

.link-button {
    border: 0;
    background: none;
    color: var(--accent);
    padding: 0;
}

.auth-switch {
    text-align: center;
    margin-top: 18px;
    color: var(--muted);
}

.legal-small {
    margin-top: 18px;
    font-size: 11px;
    line-height: 1.5;
    color: var(--muted);
}

/* CHECKBOXES */

.check {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    margin: 12px 0;
    color: #cbd1d9;
    font-size: 13px;
    line-height: 1.4;
}

.check input {
    margin-top: 3px;
    accent-color: var(--accent);
}

/* APP */

.app {
    height: 100vh;
    display: flex;
    overflow: hidden;
}

.sidebar {
    width: 320px;
    min-width: 320px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}

.sidebar-header {
    padding: 18px;
    border-bottom: 1px solid var(--border);
}

.sidebar-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.sidebar-title strong {
    font-size: 20px;
}

.icon-btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 35px;
    height: 35px;
    border-radius: 9px;
}

.search {
    padding: 12px;
}

.conversation-list {
    flex: 1;
    overflow-y: auto;
}

.conversation {
    padding: 13px 15px;
    border-bottom: 1px solid rgba(255,255,255,.035);
    cursor: pointer;
}

.conversation:hover {
    background: var(--panel2);
}

.conversation.active {
    background: rgba(108,140,255,.12);
}

.conversation-name {
    font-weight: 700;
    margin-bottom: 4px;
}

.conversation-preview {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border);
}

.profile-button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: 0;
    color: var(--text);
    text-align: left;
    padding: 7px;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 65px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    justify-content: space-between;
    background: var(--panel);
}

.chat-title {
    font-weight: 700;
}

.chat-status {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
}

.message {
    max-width: min(650px, 80%);
    padding: 9px 12px;
    border-radius: 13px;
    background: var(--panel2);
    align-self: flex-start;
    position: relative;
}

.message.mine {
    align-self: flex-end;
    background: #27386f;
}

.message-author {
    font-size: 11px;
    color: #aab2bf;
    margin-bottom: 3px;
}

.message-body {
    white-space: pre-wrap;
    word-break: break-word;
}

.message-meta {
    font-size: 10px;
    color: #9da6b3;
    margin-top: 4px;
}

.message-actions {
    display: flex;
    gap: 4px;
    margin-top: 6px;
}

.message-actions button {
    border: 0;
    background: rgba(255,255,255,.07);
    color: #cbd1d9;
    font-size: 11px;
    border-radius: 6px;
    padding: 4px 7px;
}

.composer {
    border-top: 1px solid var(--border);
    padding: 12px;
    display: flex;
    gap: 8px;
    background: var(--panel);
}

.composer textarea {
    flex: 1;
    resize: none;
    min-height: 45px;
    max-height: 130px;
    background: #0d1116;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    outline: none;
}

.send-btn {
    width: 70px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-weight: 700;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
}

.modal-box {
    width: min(650px, 100%);
    max-height: 85vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.modal-header h2 {
    margin: 0;
}

.close {
    background: transparent;
    border: 0;
    color: var(--muted);
    font-size: 24px;
}

.legal-content {
    color: #c9cfd8;
    line-height: 1.65;
    font-size: 14px;
}

.legal-content h3 {
    color: white;
    margin-top: 22px;
}

.legal-content ul {
    padding-left: 22px;
}

/* SEARCH RESULTS */

.results {
    padding: 0 12px 12px;
}

.result {
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-top: 7px;
    background: var(--panel2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.result-name {
    font-weight: 700;
}

.result-username {
    color: var(--muted);
    font-size: 12px;
}

/* PROFILE */

.profile {
    text-align: center;
}

.avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #28334c;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: 800;
}

.profile h2 {
    margin: 12px 0 4px;
}

.profile .username {
    color: var(--muted);
}

.profile-actions {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

/* MOBILE */

@media (max-width: 750px) {
    .sidebar {
        width: 100%;
        min-width: 0;
    }

    .main {
        display: none;
    }

    .app.chat-open .sidebar {
        display: none;
    }

    .app.chat-open .main {
        display: flex;
    }

    .back-mobile {
        display: block !important;
    }

    .message {
        max-width: 88%;
    }
}

@media (min-width: 751px) {
    .back-mobile {
        display: none !important;
    }
}
</style>
</head>

<body>

<!-- AUTH SCREEN -->

<div id="authScreen" class="screen auth-screen">
    <div class="auth-box">

        <div class="logo">ChatApp</div>
        <div class="subtitle">Private conversations. Simple connection.</div>

        <!-- LOGIN -->

        <div id="loginForm">

            <div class="field">
                <label>Username or Email</label>
                <input id="loginInput" autocomplete="username">
            </div>

            <div class="field">
                <label>Password</label>
                <input id="loginPassword" type="password" autocomplete="current-password">
            </div>

            <button class="primary" onclick="login()">Log In</button>

            <div class="auth-switch">
                Don't have an account?
                <button class="link-button" onclick="showRegister()">Create one</button>
            </div>

            <div class="legal-small">
                By logging in, you agree to use ChatApp responsibly and according to its Terms of Service and Community Guidelines.
            </div>

        </div>

        <!-- REGISTER -->

        <div id="registerForm" class="hidden">

            <div class="field">
                <label>Username</label>
                <input id="registerUsername" autocomplete="username">
            </div>

            <div class="field">
                <label>Email</label>
                <input id="registerEmail" type="email" autocomplete="email">
            </div>

            <div class="field">
                <label>Display Name</label>
                <input id="registerDisplayName">
            </div>

            <div class="field">
                <label>Password</label>
                <input id="registerPassword" type="password" autocomplete="new-password">
            </div>

            <label class="check">
                <input id="ageCheck" type="checkbox">
                <span>I confirm that I am <strong>16 years old or older</strong>.</span>
            </label>

            <label class="check">
                <input id="termsCheck" type="checkbox">
                <span>I have read and agree to the <button class="link-button" onclick="openLegal('terms')">Terms of Service</button>.</span>
            </label>

            <label class="check">
                <input id="privacyCheck" type="checkbox">
                <span>I have read the <button class="link-button" onclick="openLegal('privacy')">Privacy Policy</button> and understand how my personal information is processed.</span>
            </label>

            <label class="check">
                <input id="consentCheck" type="checkbox">
                <span>I consent to the processing of my personal information as described in the Privacy Policy.</span>
            </label>

            <button class="primary" onclick="register()">Create Account</button>

            <div class="auth-switch">
                Already have an account?
                <button class="link-button" onclick="showLogin()">Log in</button>
            </div>

        </div>

    </div>
</div>


<!-- APP -->

<div id="app" class="app hidden">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-title">
                <strong>ChatApp</strong>
                <button class="icon-btn" onclick="openSearch()">＋</button>
            </div>

            <input
                id="userSearch"
                class="search-input"
                placeholder="Search people..."
                oninput="searchUsers()"
            >

        </div>

        <div id="searchResults" class="results hidden"></div>

        <div id="conversationList" class="conversation-list"></div>

        <div class="sidebar-footer">

            <button class="profile-button" onclick="openMyProfile()">

                <div id="myAvatar" class="avatar" style="width:40px;height:40px;font-size:15px;">
                    ?
                </div>

                <div>
                    <div id="myName">User</div>
                    <div id="myUsername" style="font-size:12px;color:var(--muted);">
                        @user
                    </div>
                </div>

            </button>

        </div>

    </aside>


    <!-- MAIN CHAT -->

    <main class="main">

        <div class="topbar">

            <div style="display:flex;align-items:center;gap:10px;">

                <button
                    class="icon-btn back-mobile"
                    onclick="closeChat()"
                >
                    ←
                </button>

                <div>

                    <div id="chatTitle" class="chat-title">
                        Select a conversation
                    </div>

                    <div id="chatStatus" class="chat-status">
                        -
                    </div>

                </div>

            </div>

            <button
                id="chatProfileButton"
                class="secondary hidden"
                onclick="openCurrentUserProfile()"
            >
                Profile
            </button>

        </div>


        <div id="messages" class="messages">

            <div class="empty">
                Select a conversation to start chatting.
            </div>

        </div>


        <div id="typingIndicator"
             style="height:20px;padding:0 15px;font-size:12px;color:var(--muted);">
        </div>


        <div class="composer">

            <textarea
                id="messageInput"
                placeholder="Write a message..."
                oninput="handleTyping()"
                onkeydown="messageKeydown(event)"
            ></textarea>

            <button class="send-btn" onclick="sendMessage()">
                Send
            </button>

        </div>

    </main>

</div>


<!-- MODAL -->

<div id="modal" class="modal hidden" onclick="closeModalOutside(event)">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">ChatApp</h2>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_BASE = "https://chatapp-backend-ol8d.onrender.com";


/* =========================================================
   STATE
========================================================= */

let accessToken = localStorage.getItem("chatapp_access");
let refreshToken = localStorage.getItem("chatapp_refresh");

let currentUser = null;
let conversations = [];
let currentConversation = null;
let currentMessages = [];

let pollTimer = null;
let typingTimer = null;
let searchTimer = null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function $(id) {
    return document.getElementById(id);
}

function escapeHTML(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatTime(dateString) {

    if (!dateString) return "";

    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) return "";

    return date.toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
    });
}

function avatarLetter(user) {

    const text =
        user?.display_name ||
        user?.username ||
        "?";

    return text.charAt(0).toUpperCase();
}

function saveTokens(data) {

    accessToken = data.access_token;
    refreshToken = data.refresh_token;

    localStorage.setItem("chatapp_access", accessToken);
    localStorage.setItem("chatapp_refresh", refreshToken);
}

function clearTokens() {

    accessToken = null;
    refreshToken = null;

    localStorage.removeItem("chatapp_access");
    localStorage.removeItem("chatapp_refresh");
}


/* =========================================================
   API
========================================================= */

async function api(path, options = {}, retry = true) {

    const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
    };

    if (accessToken) {
        headers.Authorization = "Bearer " + accessToken;
    }

    let response;

    try {

        response = await fetch(API_BASE + path, {
            ...options,
            headers
        });

    } catch (error) {

        throw new Error("Cannot connect to the server.");
    }


    if (response.status === 401 && retry && refreshToken) {

        const refreshed = await refreshAccessToken();

        if (refreshed) {
            return api(path, options, false);
        }
    }


    let data = {};

    try {
        data = await response.json();
    } catch (_) {}


    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            "Request failed."
        );
    }

    return data;
}


async function refreshAccessToken() {

    if (!refreshToken) return false;

    try {

        const response = await fetch(
            API_BASE + "/api/auth/refresh",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    refresh_token: refreshToken
                })
            }
        );

        if (!response.ok) {

            clearTokens();
            return false;
        }

        const data = await response.json();

        saveTokens(data);

        return true;

    } catch (_) {

        clearTokens();
        return false;
    }
}


/* =========================================================
   AUTH UI
========================================================= */

function showLogin() {

    $("loginForm").classList.remove("hidden");
    $("registerForm").classList.add("hidden");
}

function showRegister() {

    $("loginForm").classList.add("hidden");
    $("registerForm").classList.remove("hidden");
}


async function login() {

    const loginValue = $("loginInput").value.trim();
    const password = $("loginPassword").value;

    if (!loginValue || !password) {
        alert("Enter your login and password.");
        return;
    }

    try {

        const data = await api(
            "/api/auth/login",
            {
                method: "POST",
                body: JSON.stringify({
                    login: loginValue,
                    password
                })
            },
            false
        );

        saveTokens(data);

        await startApp();

    } catch (error) {

        alert(error.message);
    }
}


async function register() {

    const username = $("registerUsername").value.trim();
    const email = $("registerEmail").value.trim();
    const displayName = $("registerDisplayName").value.trim();
    const password = $("registerPassword").value;

    const ageOK = $("ageCheck").checked;
    const termsOK = $("termsCheck").checked;
    const privacyOK = $("privacyCheck").checked;
    const consentOK = $("consentCheck").checked;


    if (!username || !email || !password) {

        alert("Username, email and password are required.");
        return;
    }


    if (!ageOK) {

        alert("You must confirm that you are 16 or older to use ChatApp.");
        return;
    }


    if (!termsOK || !privacyOK || !consentOK) {

        alert("You must agree to the Terms, Privacy Policy and consent before creating an account.");
        return;
    }


    if (password.length < 8) {

        alert("Use a password with at least 8 characters.");
        return;
    }


    try {

        const data = await api(
            "/api/auth/register",
            {
                method: "POST",
                body: JSON.stringify({
                    username,
                    email,
                    password,
                    display_name: displayName || username
                })
            },
            false
        );

        saveTokens(data);

        await startApp();

    } catch (error) {

        alert(error.message);
    }
}


/* =========================================================
   START APP
========================================================= */

async function startApp() {

    $("authScreen").classList.add("hidden");
    $("app").classList.remove("hidden");

    try {

        const data = await api("/api/auth/me");

        currentUser = data.user;

        updateMyProfileUI();

        await loadConversations();

        startPolling();

    } catch (error) {

        console.error(error);

        clearTokens();

        $("app").classList.add("hidden");
        $("authScreen").classList.remove("hidden");
    }
}


function updateMyProfileUI() {

    if (!currentUser) return;

    $("myName").textContent =
        currentUser.display_name ||
        currentUser.username;

    $("myUsername").textContent =
        "@" + currentUser.username;

    $("myAvatar").textContent =
        avatarLetter(currentUser);
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    try {

        if (refreshToken) {

            await api(
                "/api/auth/logout",
                {
                    method: "POST",
                    body: JSON.stringify({
                        refresh_token: refreshToken
                    })
                },
                false
            );
        }

    } catch (_) {}


    clearTokens();

    currentUser = null;
    conversations = [];
    currentConversation = null;

    stopPolling();

    $("app").classList.add("hidden");
    $("authScreen").classList.remove("hidden");

    showLogin();
}


/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations() {

    try {

        const data =
            await api("/api/conversations");

        conversations =
            data.conversations ||
            [];

        renderConversations();

    } catch (error) {

        console.error(error);
    }
}


function renderConversations() {

    const container =
        $("conversationList");

    container.innerHTML = "";


    if (!conversations.length) {

        container.innerHTML = `
            <div class="empty" style="padding:25px;">
                No conversations yet.
                <br><br>
                Search for someone to start chatting.
            </div>
        `;

        return;
    }


    conversations.forEach(conversation => {

        const div =
            document.createElement("div");

        div.className =
            "conversation" +
            (
                currentConversation &&
                currentConversation.id === conversation.id
                    ? " active"
                    : ""
            );


        const title =
            conversation.title ||
            conversation.name ||
            conversation.display_name ||
            conversation.username ||
            (
                conversation.type === "group"
                    ? "Group"
                    : "Conversation"
            );


        div.innerHTML = `
            <div class="conversation-name">
                ${escapeHTML(title)}
            </div>

            <div class="conversation-preview">
                ${escapeHTML(
                    conversation.last_message?.body ||
                    conversation.last_message ||
                    "No messages yet"
                )}
            </div>
        `;


        div.onclick = () => {
            openConversation(conversation.id);
        };


        container.appendChild(div);
    });
}


/* =========================================================
   OPEN CONVERSATION
========================================================= */

async function openConversation(id) {

    try {

        const data =
            await api("/api/conversations/" + id);

        currentConversation =
            data.conversation ||
            data;


        $("app").classList.add("chat-open");

        renderConversations();

        updateChatHeader();

        await loadMessages();

        await markRead();

        $("messageInput").focus();

    } catch (error) {

        alert(error.message);
    }
}


function closeChat() {

    $("app").classList.remove("chat-open");

    currentConversation = null;

    $("chatTitle").textContent =
        "Select a conversation";

    $("chatStatus").textContent =
        "-";

    $("chatProfileButton").classList.add("hidden");

    $("messages").innerHTML = `
        <div class="empty">
            Select a conversation to start chatting.
        </div>
    `;

    renderConversations();
}


function updateChatHeader() {

    if (!currentConversation) return;


    let title =
        currentConversation.title ||
        currentConversation.name ||
        currentConversation.display_name;


    if (!title && currentConversation.type === "direct") {

        const other =
            getOtherUser(currentConversation);

        if (other) {

            title =
                other.display_name ||
                other.username;
        }
    }


    $("chatTitle").textContent =
        title ||
        "Conversation";


    $("chatStatus").textContent =
        currentConversation.type === "group"
            ? "Group conversation"
            : "Direct message";


    if (currentConversation.type === "direct") {

        $("chatProfileButton").classList.remove("hidden");

    } else {

        $("chatProfileButton").classList.add("hidden");
    }
}


function getOtherUser(conversation) {

    if (!conversation) return null;

    if (conversation.other_user) {
        return conversation.other_user;
    }

    if (conversation.user) {
        return conversation.user;
    }

    if (
        conversation.members &&
        currentUser
    ) {

        return conversation.members.find(
            member =>
                String(member.id) !==
                String(currentUser.id)
        );
    }

    return null;
}


/* =========================================================
   MESSAGES
========================================================= */

async function loadMessages() {

    if (!currentConversation) return;

    try {

        const data =
            await api(
                "/api/conversations/" +
                currentConversation.id +
                "/messages?limit=100"
            );

        currentMessages =
            data.messages ||
            [];

        renderMessages();

    } catch (error) {

        console.error(error);
    }
}


function renderMessages() {

    const container =
        $("messages");

    container.innerHTML = "";


    if (!currentMessages.length) {

        container.innerHTML = `
            <div class="empty">
                No messages yet.
                <br>
                Say something.
            </div>
        `;

        return;
    }


    currentMessages.forEach(message => {

        const mine =
            String(message.user_id) ===
            String(currentUser?.id);


        const div =
            document.createElement("div");

        div.className =
            "message" +
            (mine ? " mine" : "");


        const author =
            message.user?.display_name ||
            message.user?.username ||
            message.username ||
            (
                mine
                    ? "You"
                    : "User"
            );


        let actions = "";


        if (mine) {

            actions = `
                <div class="message-actions">

                    <button onclick="editMessage('${message.id}')">
                        Edit
                    </button>

                    <button onclick="deleteMessage('${message.id}')">
                        Delete
                    </button>

                </div>
            `;
        }


        div.innerHTML = `

            <div class="message-author">
                ${escapeHTML(author)}
            </div>

            <div class="message-body">
                ${escapeHTML(message.body || "")}
            </div>

            <div class="message-meta">
                ${formatTime(message.created_at)}
                ${message.edited_at ? " · edited" : ""}
            </div>

            ${actions}

        `;


        container.appendChild(div);
    });


    container.scrollTop =
        container.scrollHeight;
}


async function sendMessage() {

    if (!currentConversation) {

        alert("Open a conversation first.");
        return;
    }


    const input =
        $("messageInput");

    const body =
        input.value.trim();


    if (!body) return;


    input.value = "";


    try {

        await api(
            "/api/conversations/" +
            currentConversation.id +
            "/messages",
            {
                method: "POST",
                body: JSON.stringify({
                    body
                })
            }
        );


        await loadMessages();

        await markRead();

        await loadConversations();

    } catch (error) {

        alert(error.message);

        input.value = body;
    }
}


function messageKeydown(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}


async function editMessage(id) {

    const message =
        currentMessages.find(
            item => String(item.id) === String(id)
        );

    if (!message) return;


    const body =
        prompt(
            "Edit message:",
            message.body
        );


    if (
        body === null ||
        !body.trim()
    ) return;


    try {

        await api(
            "/api/messages/" + id,
            {
                method: "PUT",
                body: JSON.stringify({
                    body: body.trim()
                })
            }
        );

        await loadMessages();

    } catch (error) {

        alert(error.message);
    }
}


async function deleteMessage(id) {

    if (!confirm("Delete this message?")) {
        return;
    }


    try {

        await api(
            "/api/messages/" + id,
            {
                method: "DELETE"
            }
        );

        await loadMessages();

    } catch (error) {

        alert(error.message);
    }
}


/* =========================================================
   READ STATUS
========================================================= */

async function markRead() {

    if (!currentConversation) return;

    try {

        await api(
            "/api/conversations/" +
            currentConversation.id +
            "/read",
            {
                method: "POST"
            }
        );

    } catch (_) {}
}


/* =========================================================
   TYPING
========================================================= */

function handleTyping() {

    if (!currentConversation) return;


    clearTimeout(typingTimer);


    sendTyping();


    typingTimer =
        setTimeout(
            () => {},
            1500
        );
}


async function sendTyping() {

    if (!currentConversation) return;

    try {

        await api(
            "/api/conversations/" +
            currentConversation.id +
            "/typing",
            {
                method: "POST"
            }
        );

    } catch (_) {}
}


/* =========================================================
   POLLING
========================================================= */

function startPolling() {

    stopPolling();

    pollTimer =
        setInterval(
            async () => {

                if (!accessToken) return;

                try {

                    await loadConversations();

                    if (currentConversation) {
                        await loadMessages();
                    }

                } catch (_) {}

            },
            4000
        );
}


function stopPolling() {

    if (pollTimer) {

        clearInterval(pollTimer);

        pollTimer = null;
    }
}


/* =========================================================
   USER SEARCH
========================================================= */

function openSearch() {

    $("userSearch").focus();
}


function searchUsers() {

    clearTimeout(searchTimer);


    const query =
        $("userSearch").value.trim();


    if (!query) {

        $("searchResults").classList.add("hidden");

        return;
    }


    searchTimer =
        setTimeout(
            () => performUserSearch(query),
            350
        );
}


async function performUserSearch(query) {

    try {

        const data =
            await api(
                "/api/users/search?q=" +
                encodeURIComponent(query)
            );


        renderSearchResults(
            data.users || []
        );

    } catch (error) {

        console.error(error);
    }
}


function renderSearchResults(users) {

    const container =
        $("searchResults");

    container.innerHTML = "";

    container.classList.remove("hidden");


    if (!users.length) {

        container.innerHTML = `
            <div style="padding:15px;color:var(--muted);">
                No users found.
            </div>
        `;

        return;
    }


    users.forEach(user => {

        const div =
            document.createElement("div");

        div.className = "result";


        div.innerHTML = `

            <div>
                <div class="result-name">
                    ${escapeHTML(
                        user.display_name ||
                        user.username
                    )}
                </div>

                <div class="result-username">
                    @${escapeHTML(user.username)}
                </div>
            </div>

            <button class="secondary"
                onclick="openUserProfile('${user.id}')">
                View
            </button>

        `;


        container.appendChild(div);
    });
}


/* =========================================================
   USER PROFILE
========================================================= */

async function openUserProfile(userId) {

    try {

        const data =
            await api(
                "/api/users/" + userId
            );


        const user =
            data.user ||
            data;


        const friends =
            await getFriendState(user);


        showUserProfile(user, friends);

    } catch (error) {

        alert(error.message);
    }
}


async function getFriendState(user) {

    try {

        const data =
            await api("/api/friends");

        const friends =
            data.friends || [];


        const isFriend =
            friends.some(
                friend =>
                    String(friend.id) ===
                    String(user.id)
            );


        const requests =
            await api("/api/friends/requests");


        const incoming =
            requests.incoming || [];

        const outgoing =
            requests.outgoing || [];


        const incomingRequest =
            incoming.find(
                request =>
                    String(
                        request.from_user_id ||
                        request.user_id ||
                        request.id
                    ) === String(user.id)
            );


        const outgoingRequest =
            outgoing.find(
                request =>
                    String(
                        request.to_user_id ||
                        request.user_id ||
                        request.id
                    ) === String(user.id)
            );


        return {
            isFriend,
            incomingRequest,
            outgoingRequest
        };

    } catch (_) {

        return {
            isFriend: false,
            incomingRequest: null,
            outgoingRequest: null
        };
    }
}


function showUserProfile(user, state) {

    const name =
        user.display_name ||
        user.username;


    let actionHTML = "";


    if (
        String(user.id) ===
        String(currentUser.id)
    ) {

        actionHTML = `
            <button class="secondary"
                onclick="openMyProfile()">
                Edit Profile
            </button>
        `;

    } else if (state.isFriend) {

        actionHTML = `
            <button class="primary"
                onclick="messageUser('${user.id}')">
                Message
            </button>

            <button class="danger"
                onclick="removeFriend('${user.id}')">
                Remove Friend
            </button>
        `;

    } else if (state.incomingRequest) {

        actionHTML = `

            <button class="primary"
                onclick="acceptFriendRequest('${getRequestId(state.incomingRequest)}')">
                Accept Request
            </button>

            <button class="danger"
                onclick="declineFriendRequest('${getRequestId(state.incomingRequest)}')">
                Decline
            </button>

        `;

    } else if (state.outgoingRequest) {

        actionHTML = `
            <button class="secondary" disabled>
                Request Sent
            </button>
        `;

    } else {

        actionHTML = `
            <button class="primary"
                onclick="sendFriendRequest('${user.username}')">
                Add Friend
            </button>
        `;
    }


    openModal(
        name,
        `

        <div class="profile">

            <div class="avatar">
                ${escapeHTML(avatarLetter(user))}
            </div>

            <h2>
                ${escapeHTML(name)}
            </h2>

            <div class="username">
                @${escapeHTML(user.username)}
            </div>

            <div class="profile-actions">
                ${actionHTML}
            </div>

        </div>

        `
    );
}


function getRequestId(request) {

    return (
        request.id ||
        request.friendship_id ||
        request.request_id
    );
}


/* =========================================================
   FRIEND SYSTEM
========================================================= */

async function sendFriendRequest(username) {

    try {

        await api(
            "/api/friends/request",
            {
                method: "POST",
                body: JSON.stringify({
                    username
                })
            }
        );


        alert("Friend request sent.");

        closeModal();

    } catch (error) {

        alert(error.message);
    }
}


async function acceptFriendRequest(id) {

    if (!id) {

        alert("Request ID unavailable.");
        return;
    }


    try {

        await api(
            "/api/friends/requests/" +
            id +
            "/accept",
            {
                method: "POST"
            }
        );


        alert("Friend request accepted.");

        closeModal();

        await loadConversations();

    } catch (error) {

        alert(error.message);
    }
}


async function declineFriendRequest(id) {

    if (!id) return;


    try {

        await api(
            "/api/friends/" + id,
            {
                method: "DELETE"
            }
        );


        alert("Friend request declined.");

        closeModal();

    } catch (error) {

        alert(error.message);
    }
}


async function removeFriend(id) {

    if (!confirm("Remove this friend?")) {
        return;
    }


    try {

        await api(
            "/api/friends/" + id,
            {
                method: "DELETE"
            }
        );


        alert("Friend removed.");

        closeModal();

    } catch (error) {

        alert(error.message);
    }
}


/* =========================================================
   DIRECT MESSAGING
========================================================= */

async function messageUser(userId) {

    try {

        const data =
            await api(
                "/api/conversations",
                {
                    method: "POST",
                    body: JSON.stringify({
                        type: "direct",
                        user_id: userId
                    })
                }
            );


        const conversation =
            data.conversation ||
            data;


        closeModal();

        await loadConversations();

        if (conversation.id) {

            await openConversation(
                conversation.id
            );
        }

    } catch (error) {

        alert(error.message);
    }
}


async function openCurrentUserProfile() {

    if (!currentConversation) return;


    const user =
        getOtherUser(currentConversation);


    if (!user?.id) {

        alert("User profile is unavailable.");
        return;
    }


    await openUserProfile(user.id);
}

========================================================= */

function openMyProfile() {

    if (!currentUser) return;


    openModal(
        "My Profile",
        `

        <div class="profile">

            <div class="avatar">
                ${escapeHTML(
                    avatarLetter(currentUser)
                )}
            </div>

            <h2>
                ${escapeHTML(
                    currentUser.display_name ||
                    currentUser.username
                )}
            </h2>

            <div class="username">
                @${escapeHTML(currentUser.username)}
            </div>

            <br>

            <div class="field"
                 style="text-align:left;">

                <label>Display Name</label>

                <input
                    id="editDisplayName"
                    value="${escapeHTML(
                        currentUser.display_name ||
                        ""
                    )}"
                >

            </div>

            <div class="profile-actions">

                <button class="primary"
                    onclick="saveProfile()">
                    Save
                </button>

                <button class="danger"
                    onclick="logout()">
                    Log Out
                </button>

            </div>

        </div>

        `
    );
}


async function saveProfile() {

    const displayName =
        $("editDisplayName").value.trim();


    try {

        const data =
            await api(
                "/api/users/me",
                {
                    method: "PUT",
                    body: JSON.stringify({
                        display_name:
                            displayName
                    })
                }
            );


        currentUser =
            data.user ||
            currentUser;


        updateMyProfileUI();

        closeModal();

    } catch (error) {

        alert(error.message);
    }
}
